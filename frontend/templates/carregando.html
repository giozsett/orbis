<!DOCTYPE html>

<html class="dark" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ORBIS | Alinhando Constelações</title>

                    "on-surface": "#dbe2f8",
                    "on-surface-variant": "#e5bcc4",
                    "on-tertiary-fixed": "#2d0050",
                    "surface-bright": "#31394a",
                    "on-tertiary": "#4a007f",
                    "secondary": "#eab9ce",
                    "on-primary-fixed-variant": "#8f0041",
                    "tertiary-fixed": "#f1dbff",
                    "surface-container-highest": "#2d3546",
                    "on-secondary-fixed-variant": "#603c4d",
                    "outline": "#ac878f",
                    "primary-fixed-dim": "#ffb1c3",
                    "secondary-container": "#633e4f",
                    "primary": "#ffb1c3",
                    "on-background": "#dbe2f8",
                    "tertiary-container": "#b86dfd",
                    "outline-variant": "#5c3f45",
                    "inverse-primary": "#bb0058",
                    "inverse-on-surface": "#283041",
                    "primary-container": "#ff4b89",
                    "on-primary-container": "#590026",
                    "inverse-surface": "#dbe2f8",
                    "on-primary-fixed": "#3f0019",
                    "on-primary": "#66002c",
                    "error": "#ffb4ab",
                    "surface-container": "#18202f",
                    "surface-variant": "#2d3546",
                    "on-tertiary-fixed-variant": "#680eac",
                    "on-error-container": "#ffdad6",
                    "surface-container-lowest": "#060e1d",
                    "surface-container-low": "#131c2b",
                    "on-tertiary-container": "#410070",
                    "error-container": "#93000a",
                    "tertiary": "#deb7ff",
                    "surface-container-high": "#222a3a",
                    "primary-fixed": "#ffd9e0",
                    "surface": "#0b1323",
                    "tertiary-fixed-dim": "#deb7ff",
                    "surface-dim": "#0b1323",

            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xs": "4px",
                    "md": "16px",
                    "unit": "4px",
                    "gutter": "24px",
                    "sm": "8px",
                    "margin-desktop": "64px",
                    "xl": "48px",
                    "margin-mobile": "16px",

                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],

        },
      }
    </script>
<style>
        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotate-reverse-slow {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; filter: blur(8px); }
            50% { opacity: 0.6; filter: blur(12px); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes star-flicker {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        .mandala-layer {
            transform-origin: center;
            animation: rotate-slow 60s linear infinite;
        }
        .mandala-layer-reverse {
            transform-origin: center;
            animation: rotate-reverse-slow 45s linear infinite;
        }
        .star-particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            pointer-events: none;
        }
        .glass-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Stardust Background Canvas -->
<div class="fixed inset-0 z-0 overflow-hidden opacity-40" id="stardust-container"></div>
<!-- Animated Shader Placeholder (Using WebGL for atmospheric depth) -->

<!-- Main Loading Screen Canvas -->
<main class="relative z-20 flex flex-col items-center justify-center min-h-screen p-margin-mobile md:p-margin-desktop">
<!-- Central Mandala/Orbital System -->
<div class="relative w-64 h-64 md:w-96 md:h-96 flex items-center justify-center">
<!-- Outer Glow -->
<div class="absolute inset-0 rounded-full bg-primary/20 blur-[64px] animate-pulse"></div>
<!-- Orbital Rings (SVG Mandala) -->
<svg class="w-full h-full text-primary/40" viewbox="0 0 400 400">
<!-- Inner Geometric Layer -->
<g class="mandala-layer">
<circle cx="200" cy="200" fill="none" r="80" stroke="currentColor" stroke-dasharray="4 8" stroke-width="0.5"></circle>
<polygon fill="none" points="200,100 230,170 300,170 245,215 265,285 200,240 135,285 155,215 100,170 170,170" stroke="currentColor" stroke-width="1"></polygon>
</g>
<!-- Middle Zodiac Layer -->
<g class="mandala-layer-reverse">
<circle cx="200" cy="200" fill="none" r="140" stroke="currentColor" stroke-dasharray="1 15" stroke-linecap="round" stroke-width="0.5"></circle>
<path d="M200 40 L200 60 M360 200 L340 200 M200 360 L200 340 M40 200 L60 200" stroke="currentColor" stroke-width="2"></path>
<circle cx="200" cy="200" fill="none" r="130" stroke="currentColor" stroke-width="0.25"></circle>
</g>
<!-- Outer Cosmic Ring -->
<g class="mandala-layer" style="animation-duration: 90s">
<circle cx="200" cy="200" fill="none" r="180" stroke="currentColor" stroke-dasharray="100 20" stroke-width="1"></circle>
</g>
</svg>
<!-- Center Core -->
<div class="absolute w-4 h-4 bg-primary rounded-full shadow-[0_0_20px_#ffb1c3] z-30"></div>
<!-- Floating Nodes (Constellation effect) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="absolute w-2 h-2 bg-secondary rounded-full animate-ping" style="top: 20%; left: 30%;"></div>
<div class="absolute w-1 h-1 bg-tertiary rounded-full animate-pulse" style="bottom: 25%; right: 20%;"></div>
<div class="absolute w-1.5 h-1.5 bg-primary rounded-full" style="top: 45%; right: 10%; animation: float 3s ease-in-out infinite;"></div>
</div>
</div>
<!-- Text Elements -->
<div class="mt-xl text-center space-y-md max-w-lg">
<h1 class="font-headline-lg text-headline-lg md:text-headline-xl text-on-surface tracking-tight animate-pulse">
                ORBIS
            </h1>
<div class="flex flex-col items-center gap-sm">
<p class="font-body-lg text-body-lg text-secondary/80 flex items-center gap-sm">
                    Calculando órbitas e alinhamentos...
                </p>
<div class="w-48 h-[1px] bg-outline-variant relative overflow-hidden">
<div class="absolute inset-y-0 left-0 bg-primary w-1/3 animate-[translateX_2s_infinite_linear]" style="animation: scroll-progress 1.5s infinite linear;"></div>
</div>
</div>
</div>
<!-- System Status Badges (Bottom) -->
<div class="absolute bottom-margin-mobile md:bottom-margin-desktop flex gap-gutter">
<div class="flex items-center gap-xs font-label-sm text-label-sm text-outline px-md py-xs bg-surface-container/40 rounded-full border border-white/5 glass-blur">
<span class="material-symbols-outlined text-[14px]" style="font-variation-settings: 'FILL' 1;">blur_on</span>
<span>DATA_STREAM_SYNC</span>
</div>
<div class="flex items-center gap-xs font-label-sm text-label-sm text-outline px-md py-xs bg-surface-container/40 rounded-full border border-white/5 glass-blur">
<span class="material-symbols-outlined text-[14px]">public</span>
<span>EPOCH_2024.4</span>
</div>
</div>
</main>
<!-- Overlay Grain Texture -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')] z-50"></div>
<script>
        // Progress bar simulation animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes scroll-progress {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(300%); }
            }
        `;
        document.head.appendChild(style);

        // Particle generation for "Stardust"
        const container = document.getElementById('stardust-container');
        const particleCount = 120;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'star-particle';
            
            const size = Math.random() * 2 + 1;
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            const delay = Math.random() * 5;
            const opacity = Math.random() * 0.5 + 0.1;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${posX}%`;
            particle.style.top = `${posY}%`;
            particle.style.opacity = opacity;
            
            // Randomly color some stars in brand tones
            const colors = ['#ffffff', '#ffb1c3', '#deb7ff', '#eab9ce'];
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.animation = `star-flicker ${duration}s infinite ease-in-out ${delay}s`;
            
            container.appendChild(particle);
        }

        // Mouse Parallax effect on the mandala
        document.addEventListener('mousemove', (e) => {
            const mandala = document.querySelector('svg');
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            mandala.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body></html>
